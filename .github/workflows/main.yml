name: main

on:
  push:
  schedule:
    - cron: "30 12 * * *" # 08:30 US Eastern

jobs:
  build:
    runs-on: ubuntu-24.04
    container: hubci/hugo:0.170.0
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: "Install Dart SASS"
        run: |
          curl -sSL "https://github.com/sass/dart-sass/releases/download/1.108.2/dart-sass-1.108.2-linux-x64.tar.gz" | tar -xz
          sudo mv ./dart-sass/sass /usr/local/bin/
          rm -r ./dart-sass
      - name: "Build Website"
        run: |
          hugo -s src
      - run: 'echo "DEBUG" && ls -lah src/public'
      - name: "Test Website (extended)"
        if: "${{ github.event_name == 'schedule' }}"
        run: |
          htmlproofer --checks "Links,Images,Scripts,Favicon,OpenGraph" --ignore-missing-alt --ignore-urls "/www.reddit.com/,/www.npmjs.com/" ./src/public/
      - name: "Test Website"
        if: "${{ github.event_name != 'schedule' }}"
        run: |
          htmlproofer --disable-external --checks "Links,Images,Scripts,Favicon,OpenGraph" --ignore-missing-alt --ignore-urls "/www.reddit.com/,/www.npmjs.com/" ./src/public/
